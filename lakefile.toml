name = "hex-mv-poly-mathlib"
defaultTargets = ["HexMvPolyMathlib"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexMvPoly"
git = "https://github.com/leanprover/hex-mv-poly.git"
rev = "5ebb6d54efd140548f881f3485a608552ddd5f0b"

[[require]]
name = "HexPolyMathlib"
git = "https://github.com/leanprover/hex-poly-mathlib.git"
rev = "5897ba144a95f929e975c3eeb5a5c5a956f8e2ba"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "HexMvPolyMathlib"
